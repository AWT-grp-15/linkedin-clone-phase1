<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | LinkedIn Clone</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page">
<header class="auth-header"><a class="auth-logo" href="/login.html">in</a></header>
<main class="auth-main"><section class="auth-card">
<h1>Sign in</h1><p class="subtitle">Stay updated on your professional world.</p>
<div id="authMessage" hidden></div>
<form id="loginForm" class="auth-form">
<div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
<div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
<button class="auth-submit" type="submit">Sign in</button>
</form>
<p class="auth-footer">New to LinkedIn Clone? <a href="/signup.html">Join now</a></p>
</section></main>
<script src="/js/auth.js"></script></body></html>
